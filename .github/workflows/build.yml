name: Build and Release Unix Agent

on:
  push:
    tags:
      - 'v*' # Сборка запускается автоматически при создании тега версии (например, v1.0.0)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем репозиторий кода в виртуальную машину сборщика
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Разворачиваем изолированное окружение языка Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Актуальная стабильная версия Go

      # 3. Подтягиваем и кэшируем внешние зависимости (если они появятся в go.mod)
      - name: Install dependencies
        run: |
          go mod tidy
          go mod download

      - name: Build Linux amd64
        run: |
          mkdir -p bin/linux_amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/linux_amd64/unix-hardware-agent .

      # 5. Компилируем бинарник под FreeBSD (архитектура x86_64)
      - name: Build FreeBSD amd64
        run: |
          mkdir -p bin/freebsd_amd64
          GOOS=freebsd GOARCH=amd64 go build -ldflags="-s -w" -o bin/freebsd_amd64/unix-hardware-agent .

      # 6. Компилируем бинарник под Linux ARM64
      - name: Build Linux arm64
        run: |
          mkdir -p bin/linux_arm64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o bin/linux_arm64/unix-hardware-agent .

      # 7. Автоматически пушим скомпилированные бинарники обратно в ветку main твоего GitHub,
      # чтобы инсталлятор install.sh всегда имел к ним прямой доступ по прямым ссылкам raw!
      - name: Commit and Push Binaries to Main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bin/
          
          # Проверяем, есть ли реальные изменения в бинарниках, чтобы избежать пустых ошибок коммита
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Auto-compiled hardware binaries for Unix platforms [skip ci]"
          
            # Скачиваем изменения, если ветка успела обновиться, и пушим обратно в main
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "Изменений в бинарниках не обнаружено, пуш пропущен."
          fi
