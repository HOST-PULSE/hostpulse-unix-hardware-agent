name: Build and Release Unix Agent

on:
  push:
    tags:
      - 'v*' # Сборка запускается автоматически при создании тега версии (например, v1.0.0)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем репозиторий кода в виртуальную машину сборщика
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Разворачиваем изолированное окружение языка Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Актуальная стабильная версия Go

      # 3. Подтягиваем и кэшируем внешние зависимости (если они появятся в go.mod)
      - name: Install dependencies
        run: |
          go mod tidy
          go mod download

      # 4. Компилируем бинарники сразу с уникальными именами для релиза
      - name: Build Linux amd64
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/unix-hardware-agent-linux-amd64 .

      - name: Build FreeBSD amd64
        run: |
          mkdir -p dist
          GOOS=freebsd GOARCH=amd64 go build -ldflags="-s -w" -o dist/unix-hardware-agent-freebsd-amd64 .

      - name: Build Linux arm64
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/unix-hardware-agent-linux-arm64 .

      # 5. Публикуем бинарники из папки dist в GitHub Релизы
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
